[package]
name = "basis-swift"
description = "The Rust half of the Basis Swift package: basis bound through UniFFI."
version = "0.2.0"
edition = "2024"
rust-version = "1.95"
license = "MIT"
publish = false

[lib]
# `lib` for uniffi-bindgen, which reads the metadata out of the compiled
# library; `staticlib` is what the XCFramework links into an app.
crate-type = ["lib", "staticlib", "cdylib"]
name = "basis_swift"

[[bin]]
name = "uniffi-bindgen"
path = "uniffi-bindgen.rs"

[dependencies]
basis = { version = "=0.23.0", features = ["responses-websocket"] }
async-trait = "0.1"
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "macros"] }
# basis's WebSocket wire frames; a wss:// endpoint also needs this TLS connector.
tokio-tungstenite = { version = "=0.28.0", features = ["rustls-tls-webpki-roots"] }
uniffi = { version = "=0.32.2", features = ["cli"] }

[profile.release]
lto = true
codegen-units = 1
