[package]
name = "basis-ffi"
description = "UniFFI bindings for the basis SDK."
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "MIT"
publish = false

[lib]
# `lib` for uniffi-bindgen, which reads the metadata out of the compiled
# library; `staticlib` is what the XCFramework links into an app.
crate-type = ["lib", "staticlib", "cdylib"]
name = "basis_ffi"

[[bin]]
name = "uniffi-bindgen"
path = "uniffi-bindgen.rs"

[dependencies]
basis = "0.22.2"
async-trait = "0.1"
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "sync"] }
uniffi = { version = "=0.32.2", features = ["cli"] }

[profile.release]
lto = true
codegen-units = 1
